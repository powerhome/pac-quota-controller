{{- if and .Values.prometheus.enable .Values.prometheus.alerting.enable -}}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "chart.name" . }}-alerting-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "chart.labels" . | nindent 4 }}
spec:
  groups:
    - name: pac-quota-controller.rules
      rules:
        {{- if .Values.prometheus.alerting.rules.reconcileErrors.enable }}
        - alert: QuotaControllerReconcileErrors
          annotations:
            summary: ClusterResourceQuota controller reconciliation errors
            description: "The ClusterResourceQuota controller is experiencing reconciliation errors for {{`{{ $labels.crq_name }}`}}."
          expr: |
            rate(pac_quota_controller_reconcile_errors_total[5m]) > {{ .Values.prometheus.alerting.rules.reconcileErrors.threshold }}
          for: {{ .Values.prometheus.alerting.rules.reconcileErrors.for }}
          labels:
            severity: warning
        {{- end }}

        {{- if .Values.prometheus.alerting.rules.quotaBreach.enable }}
        - alert: QuotaBreached
          annotations:
            summary: ClusterResourceQuota limit breached
            description: "ClusterResourceQuota {{`{{ $labels.crq_name }}`}} has exceeded its assigned limit for resource {{`{{ $labels.resource }}`}}."
          expr: |
            pac_quota_controller_crq_total_usage > 1.0
            unless on(crq_name) pac_quota_controller_crq_report_only == 1
          for: {{ .Values.prometheus.alerting.rules.quotaBreach.for }}
          labels:
            severity: critical
        {{- end }}

        {{- if .Values.prometheus.alerting.rules.resourcePressure.enable }}
        - alert: CrqResourcePressure
          annotations:
            summary: ClusterResourceQuota resource under sustained pressure
            description: "ClusterResourceQuota {{`{{ $labels.crq_name }}`}} ({{`{{ $labels.namespace }}`}} on {{`{{ $labels.cluster }}`}}) has held resource {{`{{ $labels.resource }}`}} above 95% for at least 24 of the last 168 hourly samples."
          expr: |
            (
              (
                sum by (crq_name, resource) (
                  count_over_time(
                    (
                      pac_quota_controller_crq_total_usage > 0.95
                      unless on(crq_name) pac_quota_controller_crq_report_only == 1
                    )[7d:1h]
                  )
                ) >= 24
              )
              # Historical count only decides whether this has been a sustained
              # problem, not whether it still is one — count_over_time can't
              # un-count a past sample, so without this it stays "firing" for
              # days after a real fix (bumped hard limit, cut usage, flipped to
              # ReportOnly) while old over-95% samples age out of the 7d window.
              # ANDing on the current instant value clears it the moment the
              # actual condition does.
              and on(crq_name, resource) (
                pac_quota_controller_crq_total_usage > 0.95
                unless on(crq_name) pac_quota_controller_crq_report_only == 1
              )
            )
            # Brings in the CRQ's owning namespace so Alertmanager's per-namespace
            # AlertmanagerConfig (see pac-namespaces) routes this to the app team
            # instead of only the platform default. Right-hand side is neutral
            # (*0+1) so it only donates the namespace label, not its own value.
            * on(crq_name, resource) group_left(namespace)
            (pac_quota_controller_crq_usage * 0 + 1)
          for: {{ .Values.prometheus.alerting.rules.resourcePressure.for }}
          labels:
            severity: warning
        {{- end }}

        {{- if .Values.prometheus.alerting.rules.highLatency.enable }}
        - alert: HighAggregationLatency
          annotations:
            summary: High latency in resource aggregation
            description: "Resource aggregation for ClusterResourceQuota {{`{{ $labels.crq_name }}`}} is taking longer than {{ .Values.prometheus.alerting.rules.highLatency.threshold }}s."
          expr: |
            histogram_quantile(0.95, sum(rate(pac_quota_controller_aggregation_duration_seconds_bucket[5m])) by (le, crq_name)) > {{ .Values.prometheus.alerting.rules.highLatency.threshold }}
          for: {{ .Values.prometheus.alerting.rules.highLatency.for }}
          labels:
            severity: warning
        {{- end }}

        - alert: QuotaControllerDown
          annotations:
            summary: ClusterResourceQuota controller is down
            description: "The ClusterResourceQuota controller manager has no ready replicas."
          expr: |
            kube_deployment_status_replicas_ready{deployment="pac-quota-controller-manager"} == 0
          for: 5m
          labels:
            severity: critical

        {{- if .Values.prometheus.alerting.rules.webhookBadRequest.enable }}
        - alert: WebhookAdmissionBadRequestSpike
          annotations:
            summary: ClusterResourceQuota webhook denying with bad_request
            description: "Webhook {{`{{ $labels.webhook }}`}} is denying admissions with reason=bad_request — typically signals a decode or unsupported-operation bug in the webhook, NOT a quota breach."
          expr: |
            rate(pac_quota_controller_webhook_admission_denied_total{reason="bad_request"}[5m]) > {{ .Values.prometheus.alerting.rules.webhookBadRequest.threshold }}
          for: {{ .Values.prometheus.alerting.rules.webhookBadRequest.for }}
          labels:
            severity: warning
        {{- end }}

        {{- if .Values.prometheus.alerting.rules.eventsCleanupStalled.enable }}
        - alert: EventsCleanupStalled
          annotations:
            summary: PAC quota events cleanup has not run
            description: "No PAC quota events have been cleaned in the last {{ .Values.prometheus.alerting.rules.eventsCleanupStalled.window }}. The cleanup loop may have regressed (RBAC, source-label bug, etc.)."
          expr: |
            sum(increase(pac_quota_controller_events_cleaned_total[{{ .Values.prometheus.alerting.rules.eventsCleanupStalled.window }}])) == 0
          for: {{ .Values.prometheus.alerting.rules.eventsCleanupStalled.for }}
          labels:
            severity: warning
        {{- end }}
{{- end }}
